name: Submit IndexNow

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  submit:
    name: Submit sitemap URLs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Submit all sitemap URLs to IndexNow
        run: node scripts/submit-indexnow.js --all
